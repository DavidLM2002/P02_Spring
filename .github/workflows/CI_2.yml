name: El Filtro de Desarrollo

# --- CONFIGURACIÓN DEL DISPARADOR (TRIGGER) ---
# OBJETIVO: Solo disparar en la rama "feature-dev".
on:
  push:
    branches:
      - 'feature-dev' 
      # GitHub ignorará los cambios en 'main', 'dev-david', etc.
      # Solo hará caso si subes a 'feature-dev'.

jobs:
  compilacion-y-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Permisos para Maven Wrapper
      - name: Dar permisos de ejecución
        run: chmod +x mvnw

      # 4. Compilar y Testear
      # Usamos 'package' porque ejecuta la compilación Y TAMBIÉN los tests unitarios.
      - name: Ejecutar compilación y tests
        run: ./mvnw package