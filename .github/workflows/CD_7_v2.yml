name: 'Supuesto nº7: Flujos Encadenados (Dependencies)'

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  # FLUJO DE CI: Ejecución de tests
  flujo-ci-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Ejecutar Tests (CI)
        run: |
          chmod +x mvnw
          ./mvnw test

  # FLUJO DE CD: Simulación de despliegue
  flujo-cd-despliegue:
    runs-on: ubuntu-latest
    needs: flujo-ci-tests  # Pista aplicada: Este job depende del éxito del anterior
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Generar empaquetado (CD)
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: 3. Mensaje de éxito
        run: |
          echo "===================================================="
          echo "✅ CI terminado correctamente. Iniciando CD..."
          echo "🚀 Despliegue simulado con éxito por: ${{ github.actor }}"
          echo "📅 Fecha: $(date)"
          echo "===================================================="