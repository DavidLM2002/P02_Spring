name: 'Supuesto nº7: Flujos Encadenados (Dependencies)'

on:
  push:
    branches: ['*']
  workflow_dispatch:

jobs:
  # FLUJO DE CI: Ejecución de tests
  flujo-ci-tests:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Cachear maven ayuda a evitar errores de descarga de plugins
          cache: 'maven'

      - name: 3. Ejecutar Tests (CI)
        run: |
          chmod +x mvnw
          # Forzamos a Maven a usar la JAVA_HOME configurada
          ./mvnw test -Dmaven.compiler.release=21

  # FLUJO DE CD: Simulación de despliegue
  flujo-cd-despliegue:
    runs-on: ubuntu-latest
    needs: flujo-ci-tests  # Dependencia: solo corre si el CI funciona
    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Generar empaquetado (CD)
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests -Dmaven.compiler.release=21

      - name: 4. Mensaje de éxito
        run: |
          echo "===================================================="
          echo "✅ CI terminado correctamente. Iniciando CD..."
          echo "🚀 Despliegue simulado con éxito por: ${{ github.actor }}"
          echo "📅 Fecha: $(date)"
          echo "===================================================="