name: 'Supuesto nº6: Despliegue Remoto por SSH'

on:
  push:
    branches: [ "*" ] # Se ejecuta al subir cambios a main
  workflow_dispatch:     # Permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: 3. Validar Secretos (Debug)
        run: |
          if [ -z "${{ secrets.SSH_KEY }}" ]; then echo "❌ ERROR: SSH_KEY no configurado"; exit 1; fi
          if [ -z "${{ secrets.REMOTE_HOST }}" ]; then echo "❌ ERROR: REMOTE_HOST no configurado"; exit 1; fi
          echo "✅ Secretos detectados correctamente."

      - name: 4. Generar el archivo WAR
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: 5. Copiar WAR al servidor remoto (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "target/*.war"
          target: "/home/${{ secrets.REMOTE_USER }}/despliegues"
          strip_components: 1

      - name: 6. Notificador de Estado Final
        if: always() # Se ejecuta aunque el paso anterior falle para avisarnos
        run: |
          echo "===================================================="
          echo "📢 INFORME DE DESPLIEGUE"
          echo "===================================================="
          echo "📅 Fecha: $(date +'%d/%m/%Y %H:%M:%S')"
          echo "👤 Autor: ${{ github.actor }}"
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "🚀 Estado: ¡ÉXITO! El archivo se envió a ${{ secrets.REMOTE_HOST }}"
          else
            echo "❌ Estado: FALLIDO. Revisa los logs del SCP."
          fi
          echo "===================================================="