# Nombre del flujo
name: Publicación de Versiones Oficiales (Release)

# --- DISPARADOR (TRIGGER) ---
# Aquí está la magia. No queremos que esto pase en cada commit.
# Solo queremos crear una Release oficial cuando subamos una etiqueta (tag)
# que cumpla el patrón 'v*', como v1.0, v2.5.1, v1.0-beta, etc.
on:
  push:
    tags:
      - 'v*'

jobs:
  crear-release:
    runs-on: ubuntu-latest
    
    # --- PERMISOS DE GITHUB ---
    # Importante: Para crear una Release, el robot necesita permiso de ESCRITURA.
    # Sin esto, daría un error 403 (Forbidden).
    permissions:
      contents: write

    steps:
      # 1. Descargar código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. PERMISOS DE EJECUCIÓN (¡Tu recordatorio!) 🛡️
      # Imprescindible para que Maven funcione en Linux.
      - name: Dar permisos de ejecución al wrapper
        run: chmod +x mvnw

      # 4. COMPILAR EL BINARIO
      # Generamos el archivo final (.jar o .war).
      # Usamos -DskipTests porque asumimos que si hemos puesto una etiqueta
      # de versión es porque ya hemos validado que el código funciona.
      - name: Generar paquete para la Release
        run: ./mvnw -B package -DskipTests

      # 5. CREAR LA RELEASE Y SUBIR EL ARCHIVO
      # Usamos una acción muy popular ('softprops/action-gh-release') que facilita esto.
      # Coge el archivo de 'target/' y lo adjunta a la página de Releases de GitHub.
      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') # Doble seguridad: solo si es un tag
        with:
          # Ruta al archivo que queremos subir.
          # Nota: Spring Boot suele generar .jar. Si tu proyecto genera .war,
          # cambia esto a: target/*.war
          files: target/*.jar
          
          # Opcional: Genera notas automáticas basadas en los commits
          generate_release_notes: true