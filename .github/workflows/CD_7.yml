name: 'Supuesto nº7: CI/CD Encadenado'

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  # --- TRABAJO 1: CONTINUOUS INTEGRATION (CI) ---
  tests-and-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar Tests Unitarios
        run: |
          chmod +x mvnw
          ./mvnw test
        # Si este comando falla, el job "build-and-deploy" NO se ejecutará.

  # --- TRABAJO 2: CONTINUOUS DEPLOYMENT (CD) ---
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: tests-and-validation # <--- AQUÍ ESTÁ LA MAGIA: Dependencia directa
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generar WAR y Desplegar (SCP)
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests
          echo "Empaquetado listo. Iniciando transferencia..."

      - name: Copiar al servidor remoto
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "target/*.war"
          target: "/home/${{ secrets.REMOTE_USER }}/despliegues"
          strip_components: 1

      - name: Notificador Final
        if: success()
        run: |
          echo "✅ CI/CD completado. Los tests pasaron y el código está en el servidor."