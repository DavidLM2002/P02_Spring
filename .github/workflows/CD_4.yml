name: Supuesto 4 - Web de Documentación Técnica

# --- DISPARADOR ---
# Lo configuramos para que se actualice la web cada vez que subas cambios.
on:
  push:
    branches:
      - main
      - feature-dev  # Lo pongo aquí para que te funcione mientras pruebas

# --- PERMISOS ---
# Necesitamos permiso de escritura para que el robot pueda crear
# la rama 'gh-pages' y subir los archivos HTML allí.
permissions:
  contents: write

jobs:
  publicar-javadoc:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Permisos de ejecución (¡Siempre!)
      - name: Dar permisos al wrapper
        run: chmod +x mvnw

      # 4. GENERAR EL JAVADOC
      # Este comando lee tus archivos .java y crea una web HTML en 'target/site/apidocs'
      # con toda la documentación de tus clases y métodos.
      - name: Generar Javadoc
        run: ./mvnw -B javadoc:javadoc

      # 5. PUBLICAR EN GITHUB PAGES
      # Usamos la acción sugerida en la pista.
      # Coge la carpeta del Javadoc y la empuja a una rama especial llamada 'gh-pages'.
      - name: Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs # La carpeta que queremos publicar
          branch: gh-pages            # La rama donde vive la web