name: Supuesto 4 - Web (Prueba Definitiva)

on:
  push:
    branches: ['*'] # Se activa con cualquier rama
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-web:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Intentar generar Javadoc
        # El "|| true" hace que si falla, no pare el proceso.
        run: ./mvnw -B javadoc:javadoc -Ddoclint:none -DfailOnError=false || true

      - name: 4. CREAR ARCHIVO DE RESPALDO (El salvavidas)
        # Esto crea un archivo HTML manual. Si Java falla, al menos verás esto.
        run: |
          mkdir -p target/site/apidocs
          echo "<html><body><h1>¡HOLA! 🚀</h1><p>Si lees esto, GitHub Pages funciona.</p></body></html>" > target/site/apidocs/prueba.html
          # Si no existe index.html, copiamos el de prueba
          if [ ! -f target/site/apidocs/index.html ]; then
            cp target/site/apidocs/prueba.html target/site/apidocs/index.html
          fi

      - name: 5. Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs
          branch: gh-pages