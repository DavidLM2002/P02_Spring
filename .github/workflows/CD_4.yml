name: Supuesto 4 - Web de Documentación Técnica (Final)

on:
  push:
    branches:
      - main
      - dev-david
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-javadoc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos al wrapper
        run: chmod +x mvnw

      # --- EL CAMBIO CLAVE ---
      # 1. clean package: Limpia y compila todo (asegura que la carpeta target exista).
      # 2. javadoc:javadoc: Genera la documentación después de compilar.
      # 3. -DskipTests: Para ir rápido.
      # 4. -Ddoclint:none: Para que no falle por tildes o formatos.
      - name: Generar Javadoc Completo
        run: ./mvnw -B clean package javadoc:javadoc -DskipTests -Ddoclint:none

      # --- RED DE SEGURIDAD ---
      # Este paso crea la carpeta vacía si Maven falla. 
      # Así evitamos el error "Directory doesn't exist" y el flujo termina en verde.
      - name: Asegurar existencia de carpeta
        run: mkdir -p target/site/apidocs

      - name: Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs
          branch: gh-pages