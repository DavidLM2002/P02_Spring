name: Supuesto 4 - Web (Prueba Definitiva)

on:
  push:
    branches: ['*'] # Se activa con cualquier rama
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-web:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Intentar generar Javadoc
        # El "|| true" hace que si falla, no pare el proceso.
        run: ./mvnw -B javadoc:javadoc -Ddoclint:none -DfailOnError=false || true

      - name: Supuesto 4 - Web (Javadoc Real)

        on:
          push:
            branches: [main, feature-dev]
          workflow_dispatch:

        permissions:
          contents: write

        jobs:
          publicar-web:
            runs-on: ubuntu

      - name: 5. Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs
          branch: gh-pages