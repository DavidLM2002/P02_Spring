name: Supuesto 4 - Web de Documentación Técnica (Fix)

on:
  push:
    branches:
      - main
      - dev-david
      
permissions:
  contents: write

jobs:
  publicar-javadoc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos al wrapper
        run: chmod +x mvnw

      # --- CAMBIO IMPORTANTE AQUÍ ---
      # 1. -Ddoclint:none -> Ignora errores de sintaxis en los comentarios Javadoc.
      # 2. -DfailOnError=false -> Intenta generar la web aunque haya fallos.
      - name: Generar Javadoc (Modo seguro)
        run: ./mvnw -B javadoc:javadoc -Ddoclint:none -DfailOnError=false

      # --- PASO DE DEPURACIÓN ---
      # Esto nos mostrará en el log qué hay dentro de la carpeta target.
      # Si falla, podrás abrir el log de este paso y ver dónde están los archivos.
      - name: Listar archivos generados (Debug)
        run: ls -R target/

      - name: Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs
          branch: gh-pages