name: Supuesto 4 - Web (Prueba Definitiva)

on:
  push:
    branches: ['*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-web:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Añadimos cache para que sea más rápido

      - name: 3. Dar permisos al wrapper
        run: chmod +x mvnw

      - name: 4. Generar Javadoc
        # Quitamos el || true temporalmente para VER el error real si falla
        run: ./mvnw -B javadoc:javadoc -Ddoclint:none

      - name: 5. Validar y desplegar
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs
          branch: gh-pages