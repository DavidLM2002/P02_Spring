name: Supuesto 4 - Web (Prueba Definitiva)

on:
  push:
    branches: ['*'] # Se activa con cualquier rama
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-web:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Intentar generar Javadoc
        # El "|| true" hace que si falla, no pare el proceso.
        run: ./mvnw -B javadoc:javadoc -Ddoclint:none -DfailOnError=false || true

      - name: 4. Limpiar y Validar Javadoc
        run: |
          # Si por algún motivo Maven no generó el index.html,
          # creamos uno que redirija o avise, pero lo ideal es que 
          # javadoc:javadoc ya haya llenado la carpeta target/site/apidocs
          if [ ! -f target/site/apidocs/index.html ]; then
            echo "<html><body><h1>Generando documentación...</h1><p>Si ves esto, Maven no encontró clases documentadas. Revisa tus comentarios Javadoc.</p></body></html>" > target/site/apidocs/index.html
          fi

      - name: 5. Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs
          branch: gh-pages