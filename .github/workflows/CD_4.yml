name: Supuesto 4 - Web de Documentación Técnica (Fix)

on:
  push:
    branches:
      - main
      - dev-david
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar-javadoc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos al wrapper
        run: chmod +x mvnw

      # --- LA SOLUCIÓN ---
      # Añadimos -Ddoclint:none para que Java ignore errores de formato en comentarios
      # Añadimos -DfailOnError=false para forzar que termine el proceso
      - name: Generar Javadoc (Modo seguro)
        run: ./mvnw -B javadoc:javadoc -Ddoclint:none -DfailOnError=false

      # PASO DE DEPURACIÓN: Nos dirá si la carpeta se creó o no
      - name: Verificar carpeta generada
        run: ls -R target/site

      - name: Desplegar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: target/site/apidocs
          branch: gh-pages