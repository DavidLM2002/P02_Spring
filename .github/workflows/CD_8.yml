name: 'Supuesto nº8: El Guardián de Secretos'

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  # --- TRABAJO 1: CI (Se mantiene igual) ---
  tests-and-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Ejecutar Tests Unitarios
        run: |
          chmod +x mvnw
          ./mvnw test

  # --- TRABAJO 2: CD (Aquí inyectamos el Guardián de Secretos) ---
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: tests-and-validation
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generar WAR con Variables de Entorno
        # Definimos las variables de entorno para este paso
        env:
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASS: ${{ secrets.DB_PASSWORD }}
        run: |
          chmod +x mvnw
          # Si tus tests de integración necesitan la DB para compilar, 
          # Maven ahora podrá leer estas variables del entorno.
          ./mvnw clean package -DskipTests
          echo "WAR generado ocultando secretos con éxito."

      - name: Copiar al servidor remoto (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          source: "target/*.war"
          target: "/home/${{ secrets.REMOTE_USER }}/despliegues"
          strip_components: 1

      - name: Notificador Final
        if: success()
        run: |
          echo "✅ Despliegue seguro completado. Contraseña inyectada y protegida."