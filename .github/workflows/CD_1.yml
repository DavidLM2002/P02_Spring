# Nombre que verás en la lista de Actions
name: El Botón de Despliegue Manual

# --- CONFIGURACIÓN DEL DISPARADOR (TRIGGER) ---
# Aquí está la clave del ejercicio.
# En lugar de 'push' (que es automático), usamos 'workflow_dispatch'.
# Esto le dice a GitHub: "No hagas nada hasta que alguien pulse el botón".
on: workflow_dispatch

jobs:
  generar-paquete:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java 21 (Estándar del curso)
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Dar permisos al ejecutable de Maven
      - name: Dar permisos de ejecución
        run: chmod +x mvnw

      # 4. Generar el paquete (.jar)
      # Usamos 'package' para crear el archivo final en la carpeta target/
      # Añadimos -B para que el log sea limpio (como vimos en el supuesto 4)
      - name: Construir y Empaquetar
        run: ./mvnw -B package -DskipTests

      # PASO EXTRA (Opcional): Subir el .jar para que el profesor lo pueda descargar
      - name: Subir Artefacto (El .jar generado)
        uses: actions/upload-artifact@v4
        with:
          name: aplicacion-compilada
          path: target/*.jar